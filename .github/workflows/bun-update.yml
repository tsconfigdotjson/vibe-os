name: Bun update

# Bun is compiled into the release binary, so a Bun fix only reaches a box
# through a vibe-os release. Dependabot does not cover the runtime, so this job
# does two things every day:
#
# - opens a PR when oven-sh/bun has a newer release than .bun-version
# - opens an issue when the Bun in the latest vibe-os release has a published
#   advisory, which is the signal to cut a release
#
# Advisories come from the advisory database, not Bun's release notes, and are
# often published a day after the release. That is why the release check runs
# against what shipped and not only against the bump.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The PR comes from GITHUB_TOKEN, which does not trigger pull_request
      # runs, so CI is dispatched on the branch instead.
      - name: Open a PR for a newer Bun
        run: |
          latest="$(gh release view --repo oven-sh/bun --json tagName -q .tagName)"
          latest="${latest#bun-v}"
          current="$(cat .bun-version)"
          if [ "$latest" = "$current" ]; then
            echo "Bun $current is current"
            exit 0
          fi

          branch="bun-$latest"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists"
            exit 0
          fi

          advisories="$(bun scripts/bun-advisories.ts "$current" | tr '\n' ' ')"

          echo "$latest" > .bun-version
          sed -i "s|oven/bun:$current-debian|oven/bun:$latest-debian|" Dockerfile

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Bun $latest"
          git push origin "$branch"

          title="Bun $latest"
          security=""
          if [ -n "$advisories" ]; then
            title="Bun $latest (security)"
            security="**Security:** Bun $current is affected by $advisories. Raise \`engines.bun\` in package.json to >=$latest, and cut a vibe-os release once this merges."
          fi

          pr="$(gh pr create --head "$branch" --title "$title" --body "$(cat <<EOF
          Bumps Bun from $current to $latest in .bun-version and the Dockerfile.

          Release notes: https://github.com/oven-sh/bun/releases/tag/bun-v$latest

          $security
          EOF
          )")"
          gh workflow run ci.yml --ref "$branch"

          # A patch release with no advisory merges itself once CI passes. A
          # minor, or one that needs engines.bun raised, waits for a human.
          if [ -z "$advisories" ] && [ "${latest%.*}" = "${current%.*}" ]; then
            gh pr merge --auto --squash "$pr"
          fi

      - name: Open an issue when the released Bun has an advisory
        run: |
          tag="$(gh release view --json tagName -q .tagName)"
          git fetch --depth=1 origin tag "$tag"
          # Releases up to v0.6.6 predate .bun-version and were built on 1.3.10.
          shipped="$(git show "$tag:.bun-version" 2>/dev/null || echo 1.3.10)"
          advisories="$(bun scripts/bun-advisories.ts "$shipped" | tr '\n' ' ')"
          if [ -z "$advisories" ]; then
            echo "$tag ships Bun $shipped, no advisories"
            exit 0
          fi

          title="Release needed: $tag ships Bun $shipped, which has security advisories"
          if gh issue list --state open --search "in:title \"$title\"" --json title -q '.[].title' | grep -qxF "$title"; then
            echo "issue already open"
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<EOF
          The latest release, $tag, is built on Bun $shipped, which is affected by: $advisories

          Once .bun-version on main is a patched Bun (merge the Bun bump PR if one is open), raise \`engines.bun\` in package.json to match, cut a release, and redeploy. Close this issue when the release is out.
          EOF
          )"
