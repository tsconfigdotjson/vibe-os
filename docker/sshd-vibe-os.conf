# sshd settings for the vibe-os container.
#
# Nothing here is required to make certificates work — the `cert-authority`
# line vibe-os appends to ~/.ssh/authorized_keys is enough on a stock sshd.
# These just close the doors nothing is using.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no

# The container talks to itself; there is no reason to listen more widely.
ListenAddress 127.0.0.1
