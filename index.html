<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>vibe-os</title>

    <!-- Inline so a bare VPS with no outbound network still gets an icon, and
         so the page never fires a 404 for /favicon.ico. The same mark, at the
         same offset, as public/icon.svg. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d1117'/%3E%3Crect x='4' y='4' width='5' height='8' fill='%2356cfe1'/%3E%3C/svg%3E"
    />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Generated by the server, because the theme colour is a flag: two
         installed instances are otherwise identical in a dock. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- A sensible default for a normal tab. The installed app takes its colour
         from the manifest, and main.tsx replaces this one once the real
         configured value arrives. -->
    <meta name="theme-color" content="#1c2128" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="vibe-os" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
